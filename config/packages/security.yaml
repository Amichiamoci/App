security:
    # enable_authenticator_manager: true

    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        # used to reload user from session & other features (e.g. switch_user)
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email
        hwi_oauth.user.provider:
            id: hwi_oauth.user.provider
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            pattern: ^/
            provider: app_user_provider
            entry_point: form_login
            user_checker: App\Security\UserChecker

            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800 # 1 week in seconds
                path: /
                name: REMEMBERME
                always_remember_me: false

            # Main provider (email and password)
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true 
                # enable_csrf: false
                default_target_path: home
                # target_path_parameter: next
                # failure_path_parameter: prev
            logout:
                path: app_logout
                target: home

            # External service OpenID
            oauth:
                login_path: /login
                failure_path: hwi_oauth_connect_registration

                provider: app_user_provider
                use_forward: false
                
                resource_owners:
                    facebook:  "/login/check-facebook"
                    google:    "/login/check-google"
                    github:    "/login/check-github"
                    microsoft: "/login/check-microsoft"
                oauth_user_provider:
                    service: App\Security\UserProvider


    access_control:
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/connect, roles: PUBLIC_ACCESS }
        - { path: ^/profile, roles: ROLE_USER }
        - { path: ^/fanta, roles: ROLE_USER }

framework:
    rate_limiter:
        username_ip_login:
            policy: token_bucket
            limit: 5
            rate: { interval: '5 minutes' }

        ip_login:
            policy: sliding_window
            limit: 50
            interval: '15 minutes'

when@test:
    security:
        password_hashers:
            # By default, password hashers are resource intensive and take time. This is
            # important to generate secure password hashes. In tests however, secure hashes
            # are not important, waste resources and increase test times. The following
            # reduces the work factor to the lowest possible values.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
